<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Talent pool admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Login -->
  <section id="login-view" class="login-page hidden">
    <div class="login">
      <span class="logo-slot"></span>
      <div class="card">
        <h1>Talent pool</h1>
        <p>Sign in to review candidates.</p>
        <div id="login-error" class="alert error hidden" role="alert"></div>
        <form id="login-form">
          <div class="field"><label for="login-email">Email</label><input type="email" id="login-email" autocomplete="username" required></div>
          <div class="field"><label for="login-password">Password</label><input type="password" id="login-password" autocomplete="current-password" required></div>
          <button class="btn block" type="submit" id="login-btn">Sign in</button>
        </form>
      </div>
    </div>
  </section>

  <!-- App -->
  <div id="app-view" class="admin-shell hidden">
    <header class="topbar">
      <div class="brand-line"><span class="logo-slot"></span><h1>Talent pool</h1></div>
      <div class="topbar-actions">
        <span class="who" id="who"></span>
        <button class="btn on-dark small" id="export-btn">Export CSV</button>
        <button class="btn on-dark small" id="refresh-btn">Refresh</button>
        <button class="btn on-dark small" id="logout-btn">Sign out</button>
      </div>
    </header>

    <main class="admin-main">
      <div id="app-error" class="alert error hidden" role="alert"></div>

      <div class="stats" id="stats"></div>

      <div class="filters">
        <input type="search" class="search" id="f-search" placeholder="Search name, email, location, tags or notes" aria-label="Search">
        <select id="f-area" aria-label="Area"></select>
        <select id="f-seniority" aria-label="Level"></select>
        <select id="f-domain" aria-label="Experience"></select>
        <select id="f-status" aria-label="Status"></select>
        <select id="f-consent" aria-label="Consent">
          <option value="">Any consent</option>
          <option value="valid">Consent valid</option>
          <option value="soon">Expires within 30 days</option>
          <option value="expired">Consent expired</option>
        </select>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>Candidate</th><th>Area</th><th>Level</th><th>Location</th><th>Status</th><th>Rating</th><th>Added</th></tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
        <div id="empty" class="empty hidden"></div>
      </div>
    </main>
  </div>

  <!-- Candidate drawer -->
  <div id="scrim" class="scrim hidden"></div>
  <aside id="drawer" class="drawer hidden" role="dialog" aria-modal="true" aria-labelledby="d-name"></aside>

  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script>
  (function () {
    const cfg = window.TALENT_POOL_CONFIG;
    const db = window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY);
    const $ = (id) => document.getElementById(id);
    const STATUSES = ["New", "Reviewed", "Contacted", "Interviewing", "Not a fit", "Hired"];
    const DAY = 86400000;

    let candidates = [];
    let current = null;      // candidate open in the drawer
    let loadedFor = null;    // user id we've loaded data for

    document.querySelectorAll(".logo-slot").forEach((slot) => {
      if (cfg.LOGO_URL) {
        const img = new Image(); img.className = "logo"; img.alt = cfg.COMPANY_NAME; img.src = cfg.LOGO_URL;
        img.onerror = () => { slot.className = "logo-text"; slot.textContent = cfg.COMPANY_NAME; };
        slot.append(img);
      } else { slot.className = "logo-text"; slot.textContent = cfg.COMPANY_NAME; }
    });
    fillSelect("f-domain", "Any experience", cfg.EXPERIENCE_DOMAINS);
    fillSelect("f-area", "All areas", cfg.ROLE_AREAS);
    fillSelect("f-seniority", "All levels", cfg.SENIORITY);
    fillSelect("f-status", "All statuses", STATUSES);

    // ---------- helpers ----------
    function fillSelect(id, first, items) {
      const el = $(id);
      el.innerHTML = "";
      el.append(new Option(first, ""));
      items.forEach((v) => el.append(new Option(v, v)));
    }
    function esc(s) {
      return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }
    function safeUrl(u) { return /^https?:\/\//i.test(u || "") ? u : null; }
    function fmtDate(d) { return d ? new Date(d).toLocaleDateString(undefined, { day: "numeric", month: "short", year: "numeric" }) : "—"; }
    function stars(n) { return n ? "★".repeat(n) + "☆".repeat(3 - n) : ""; }
    function consentState(c) {
      if (!c.consent_expires_at) return "valid";
      const left = new Date(c.consent_expires_at) - Date.now();
      if (left <= 0) return "expired";
      if (left < 30 * DAY) return "soon";
      return "valid";
    }
    function showError(msg) { const b = $("app-error"); b.textContent = msg; b.classList.toggle("hidden", !msg); }

    // ---------- auth ----------
    db.auth.onAuthStateChange((_event, session) => {
      // Supabase advises not awaiting other calls inside this callback
      setTimeout(() => route(session), 0);
    });

    async function route(session) {
      if (!session) {
        loadedFor = null; candidates = [];
        $("app-view").classList.add("hidden");
        $("login-view").classList.remove("hidden");
        return;
      }
      $("login-view").classList.add("hidden");
      $("app-view").classList.remove("hidden");
      $("who").textContent = session.user.email;
      if (loadedFor === session.user.id) return;
      loadedFor = session.user.id;

      const { data: isAdmin, error } = await db.rpc("is_admin");
      if (error || !isAdmin) {
        showError("You’re signed in, but this account isn’t an admin yet. Add its user ID to the admins table (README, step 3), then refresh.");
        render();
        return;
      }
      load();
    }

    $("login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = $("login-btn"), err = $("login-error");
      btn.disabled = true; err.classList.add("hidden");
      const { error } = await db.auth.signInWithPassword({
        email: $("login-email").value.trim(),
        password: $("login-password").value
      });
      btn.disabled = false;
      if (error) { err.textContent = "Email or password is incorrect."; err.classList.remove("hidden"); }
    });
    $("logout-btn").addEventListener("click", () => db.auth.signOut());

    // ---------- data ----------
    async function load() {
      showError("");
      $("rows").innerHTML = "";
      $("empty").textContent = "Loading candidates…";
      $("empty").classList.remove("hidden");
      const all = [];
      const PAGE = 1000;
      for (let from = 0; ; from += PAGE) {
        const { data, error } = await db.from("candidates").select("*")
          .order("created_at", { ascending: false }).range(from, from + PAGE - 1);
        if (error) { showError("Candidates didn’t load: " + error.message); return; }
        all.push(...data);
        if (data.length < PAGE) break;
      }
      candidates = all;
      render();
    }
    $("refresh-btn").addEventListener("click", load);

    // ---------- list ----------
    ["f-search", "f-area", "f-seniority", "f-domain", "f-status", "f-consent"].forEach((id) =>
      $(id).addEventListener("input", render));

    function filtered() {
      const q = $("f-search").value.trim().toLowerCase();
      const area = $("f-area").value, lvl = $("f-seniority").value,
            st = $("f-status").value, cons = $("f-consent").value, dom = $("f-domain").value;
      return candidates.filter((c) => {
        if (area && c.role_area !== area) return false;
        if (lvl && c.seniority !== lvl) return false;
        if (st && c.status !== st) return false;
        if (dom && !(c.experience_domains || []).includes(dom)) return false;
        if (cons && consentState(c) !== cons) return false;
        if (q) {
          const hay = [c.full_name, c.email, c.location, c.notes, c.motivation, c.proud_of, (c.tags || []).join(" ")]
            .join(" ").toLowerCase();
          if (!hay.includes(q)) return false;
        }
        return true;
      });
    }

    function render() {
      const list = filtered();
      const newCount = candidates.filter((c) => c.status === "New").length;
      const expired = candidates.filter((c) => consentState(c) === "expired").length;
      const week = candidates.filter((c) => Date.now() - new Date(c.created_at) < 7 * DAY).length;
      $("stats").innerHTML =
        `<div class="stat"><b>${candidates.length}</b><span>in the pool</span></div>` +
        `<div class="stat"><b>${newCount}</b><span>waiting for review</span></div>` +
        `<div class="stat"><b>${week}</b><span>joined this week</span></div>` +
        (expired ? `<div class="stat"><b>${expired}</b><span>consent expired, delete these</span></div>` : "");

      const tbody = $("rows");
      tbody.innerHTML = "";
      list.forEach((c) => {
        const tr = document.createElement("tr");
        tr.tabIndex = 0;
        const cs = consentState(c);
        tr.innerHTML = `
          <td><strong>${esc(c.full_name)}</strong><div class="sub">${esc(c.email)}</div>
              ${(c.tags || []).map((t) => `<span class="tag">${esc(t)}</span>`).join("")}</td>
          <td>${esc(c.role_area)}</td>
          <td>${esc(c.seniority)}</td>
          <td>${esc(c.location)}</td>
          <td><span class="pill ${esc(c.status.replace(/\s/g, ""))}">${esc(c.status)}</span>
              ${cs === "expired" ? '<div><span class="pill warn">Consent expired</span></div>' : ""}
              ${cs === "soon" ? '<div><span class="pill warn">Consent ends soon</span></div>' : ""}</td>
          <td><span class="stars">${stars(c.rating)}</span></td>
          <td>${fmtDate(c.created_at)}</td>`;
        tr.addEventListener("click", () => openDrawer(c.id));
        tr.addEventListener("keydown", (e) => { if (e.key === "Enter") openDrawer(c.id); });
        tbody.append(tr);
      });

      const empty = $("empty");
      if (!candidates.length) { empty.textContent = "No one has joined yet. Share your talent pool link to get your first candidates."; }
      else if (!list.length) { empty.textContent = "No candidates match these filters. Clear a filter or change the search."; }
      empty.classList.toggle("hidden", list.length > 0);
    }

    // ---------- drawer ----------
    function openDrawer(id) {
      current = candidates.find((c) => c.id === id);
      if (!current) return;
      const c = current;
      const li = safeUrl(c.linkedin_url), pf = safeUrl(c.portfolio_url);
      const link = (u, raw) => u ? `<a href="${esc(u)}" target="_blank" rel="noopener noreferrer">${esc(raw)}</a>` : "—";

      $("drawer").innerHTML = `
        <div class="drawer-head">
          <div>
            <h2 id="d-name">${esc(c.full_name)}</h2>
            <div class="meta">${esc(c.role_area)}${c.seniority ? ", " + esc(c.seniority) : ""}</div>
          </div>
          <button class="btn ghost small" id="d-close">Close</button>
        </div>

        <dl class="facts">
          <dt>Email</dt><dd><a href="mailto:${esc(c.email)}">${esc(c.email)}</a></dd>
          <dt>Phone</dt><dd>${esc(c.phone) || "—"}</dd>
          <dt>Location</dt><dd>${esc(c.location) || "—"}</dd>
          <dt>LinkedIn</dt><dd>${link(li, c.linkedin_url)}</dd>
          <dt>Portfolio</dt><dd>${link(pf, c.portfolio_url)}</dd>
          <dt>Experience in</dt><dd>${(c.experience_domains || []).map((d) => `<span class="tag">${esc(d)}</span>`).join("") || "—"}</dd>
          <dt>English</dt><dd>${esc(c.english_level) || "—"}</dd>
          <dt>Type of work</dt><dd>${esc(c.employment_type) || "—"}</dd>
          <dt>Work setup</dt><dd>${esc(c.work_setup) || "—"}</dd>
          <dt>Availability</dt><dd>${esc(c.availability) || "—"}</dd>
          <dt>Salary</dt><dd>${esc(c.salary_expectation) || "—"}</dd>
          <dt>Heard via</dt><dd>${esc(c.referral_source) || "—"}</dd>
          <dt>Joined</dt><dd>${fmtDate(c.created_at)}</dd>
          <dt>Consent until</dt><dd>${fmtDate(c.consent_expires_at)}</dd>
          <dt>Last contacted</dt><dd id="d-contacted">${fmtDate(c.last_contacted_at)}</dd>
        </dl>

        ${c.proud_of ? `<h3>Something they’re proud of</h3><div class="quote-block">${esc(c.proud_of)}</div>` : ""}
        ${c.motivation ? `<h3>Why Synder</h3><div class="quote-block">${esc(c.motivation)}</div>` : ""}

        <div class="drawer-actions" style="margin-bottom:26px">
          ${c.cv_path ? '<button class="btn" id="d-cv">Open CV</button>' : "<span class='hint'>No CV attached</span>"}
          <a class="btn ghost" href="mailto:${esc(c.email)}">Email candidate</a>
        </div>

        <h3>Your assessment</h3>
        <div class="field">
          <label for="d-status">Status</label>
          <select id="d-status">${STATUSES.map((s) => `<option${s === c.status ? " selected" : ""}>${s}</option>`).join("")}</select>
        </div>
        <div class="field">
          <label>Rating</label>
          <div class="rating-pick" id="d-rating" data-value="${c.rating || 0}">
            ${[1, 2, 3].map((n) => `<button type="button" data-n="${n}" aria-label="${n} of 3" class="${n <= (c.rating || 0) ? "on" : ""}">★</button>`).join("")}
          </div>
        </div>
        <div class="field">
          <label for="d-tags">Tags <span class="optional">(comma separated)</span></label>
          <input type="text" id="d-tags" value="${esc((c.tags || []).join(", "))}" placeholder="e.g. fintech, SQL, German speaker">
        </div>
        <div class="field">
          <label for="d-notes">Notes</label>
          <textarea id="d-notes">${esc(c.notes)}</textarea>
        </div>
        <div id="d-msg" class="alert hidden"></div>
        <div class="drawer-actions">
          <button class="btn" id="d-save">Save changes</button>
          <button class="btn ghost" id="d-contact">Mark contacted today</button>
          <span class="spacer"></span>
          <button class="btn danger" id="d-delete">Delete candidate</button>
        </div>`;

      $("scrim").classList.remove("hidden");
      $("drawer").classList.remove("hidden");
      $("d-close").focus();

      $("d-close").onclick = closeDrawer;
      if (c.cv_path) $("d-cv").onclick = openCv;
      $("d-rating").querySelectorAll("button").forEach((b) => b.onclick = () => {
        const n = Number(b.dataset.n);
        const box = $("d-rating");
        const next = Number(box.dataset.value) === n ? 0 : n;  // tap again to clear
        box.dataset.value = next;
        box.querySelectorAll("button").forEach((x) => x.classList.toggle("on", Number(x.dataset.n) <= next));
      });
      $("d-save").onclick = () => save({});
      $("d-contact").onclick = () => save({ last_contacted_at: new Date().toISOString(), status: c.status === "New" || c.status === "Reviewed" ? "Contacted" : undefined });
      $("d-delete").onclick = removeCandidate;
    }

    function closeDrawer() {
      $("scrim").classList.add("hidden");
      $("drawer").classList.add("hidden");
      current = null;
    }
    $("scrim").addEventListener("click", closeDrawer);
    document.addEventListener("keydown", (e) => { if (e.key === "Escape" && current) closeDrawer(); });

    function drawerMsg(text, kind) {
      const m = $("d-msg");
      m.className = "alert " + kind;
      m.textContent = text;
    }

    async function save(extra) {
      const rating = Number($("d-rating").dataset.value) || null;
      const patch = {
        status: $("d-status").value,
        rating,
        tags: $("d-tags").value.split(",").map((t) => t.trim()).filter(Boolean),
        notes: $("d-notes").value.trim() || null
      };
      Object.entries(extra).forEach(([k, v]) => { if (v !== undefined) patch[k] = v; });

      const { data, error } = await db.from("candidates").update(patch).eq("id", current.id).select().single();
      if (error) { drawerMsg("Changes weren’t saved: " + error.message, "error"); return; }
      Object.assign(current, data);
      if (patch.status) $("d-status").value = current.status;
      $("d-contacted").textContent = fmtDate(current.last_contacted_at);
      drawerMsg("Changes saved.", "ok");
      render();
    }

    async function openCv() {
      const win = window.open("", "_blank");  // open first so popup blockers allow it
      const { data, error } = await db.storage.from("cvs").createSignedUrl(current.cv_path, 120);
      if (error) { if (win) win.close(); drawerMsg("The CV couldn’t be opened: " + error.message, "error"); return; }
      if (win) win.location = data.signedUrl; else window.location = data.signedUrl;
    }

    async function removeCandidate() {
      if (!confirm("Delete " + current.full_name + " and their CV permanently? This can’t be undone.")) return;
      if (current.cv_path) {
        const { error } = await db.storage.from("cvs").remove([current.cv_path]);
        if (error) { drawerMsg("The CV wasn’t deleted: " + error.message, "error"); return; }
      }
      const { error } = await db.from("candidates").delete().eq("id", current.id);
      if (error) { drawerMsg("The candidate wasn’t deleted: " + error.message, "error"); return; }
      candidates = candidates.filter((c) => c.id !== current.id);
      closeDrawer();
      render();
    }

    // ---------- CSV export (current filters) ----------
    $("export-btn").addEventListener("click", () => {
      const cols = ["full_name", "email", "phone", "location", "linkedin_url", "portfolio_url", "role_area", "seniority",
        "experience_domains", "english_level", "employment_type", "work_setup", "availability", "salary_expectation",
        "referral_source", "proud_of", "motivation", "status", "rating", "tags", "notes", "created_at", "last_contacted_at", "consent_expires_at"];
      const cell = (v) => {
        let s = Array.isArray(v) ? v.join("; ") : String(v ?? "");
        if (/^[=+\-@]/.test(s)) s = "'" + s;               // stop spreadsheet formula injection
        return '"' + s.replace(/"/g, '""') + '"';
      };
      const lines = [cols.join(",")].concat(filtered().map((c) => cols.map((k) => cell(c[k])).join(",")));
      const blob = new Blob(["\ufeff" + lines.join("\n")], { type: "text/csv;charset=utf-8" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "talent-pool-" + new Date().toISOString().slice(0, 10) + ".csv";
      a.click();
      URL.revokeObjectURL(a.href);
    });
  })();
  </script>
</body>
</html>
